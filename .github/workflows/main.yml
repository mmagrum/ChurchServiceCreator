name: Native AOT Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Native AOT (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet publish `
            -c Release `
            -r ${{ matrix.rid }} `
            -o publish/${{ matrix.rid }}

      - name: Publish Native AOT (macOS)
        if: matrix.os != 'windows-latest'
        run: |
          dotnet publish \
            -c Release \
            -r ${{ matrix.rid }} \
            -o publish/${{ matrix.rid }}

      - name: Archive (macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../app-${{ matrix.rid }}.zip .

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}\* `
                           -DestinationPath app-${{ matrix.rid }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: app-${{ matrix.rid }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
